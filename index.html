<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小站 · 功能导航</title>
    <link rel="stylesheet" href="./shared/styles/theme.css">
    <style>
        body { max-width: 960px; margin: 0 auto; padding: 40px 20px; }
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 40px; margin: 0 0 8px; color: var(--color-text); }
        .hero p { color: var(--color-text-muted); margin: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .card {
            display: block;
            padding: 24px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            text-decoration: none;
            color: inherit;
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
        }
        .card h2 { margin: 0 0 6px; font-size: 20px; color: var(--color-primary); }
        .card .owner { font-size: 12px; color: var(--color-text-muted); margin-bottom: 10px; }
        .card p { margin: 0; font-size: 14px; color: var(--color-text-muted); }
        footer {
            text-align: center;
            margin-top: 48px;
            color: var(--color-text-muted);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <header class="hero">
        <h1>欢迎来到我的页面</h1>
        <p>这里汇聚了各种小功能，点击卡片进入对应模块 ✨</p>
    </header>

    <main class="grid">
        <a class="card" href="./modules/module_chatRoom/index.html">
            <h2>聊天室</h2>
            <div class="owner">负责人：我</div>
            <p>在这里开发属于你的功能。</p>
        </a>
        <a class="card" href="./modules/module_memo/index.html">
            <h2>备忘录</h2>
            <div class="owner">负责人：crr</div>
            <p>在这里开发属于 crr 的功能。</p>
        </a>
    </main>

    <footer>新增模块：在 <code>modules/</code> 下新建文件夹，并在本页加一张卡片即可。</footer>

    <script src="./shared/js/common.js"></script>
    <script>App.applyTheme();</script>
</body>
</html>
